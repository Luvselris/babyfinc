<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>babyfinch ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-color: #fff4f6;
      --card-bg: rgba(255, 255, 255, 0.95);
      --primary-pink: #f28b9f;
      --border-color: #fcd7e0;
      --text-main: #4a3e3d;
      --text-muted: #8e7c7e;
      --shadow: 0 10px 30px rgba(242, 139, 159, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .container {
      max-width: 460px;
      margin: 0 auto;
      padding: 20px 16px 80px;
      position: relative;
      z-index: 2;
    }

    .header-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      padding: 24px 18px;
      box-shadow: var(--shadow);
      border: 1.5px solid var(--border-color);
      text-align: center;
      margin-bottom: 18px;
    }

    .profile-img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3.5px solid #fff;
      box-shadow: 0 4px 14px rgba(242, 139, 159, 0.2);
      margin-bottom: 10px;
    }

    .store-name {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary-pink);
    }

    .store-bio {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.5;
      white-space: pre-line;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #f29bb0, var(--primary-pink));
      color: #fff;
      border-color: var(--primary-pink);
      box-shadow: 0 4px 10px rgba(242, 139, 159, 0.3);
    }

    .content-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 26px;
      padding: 22px;
      box-shadow: var(--shadow);
      border: 1.5px solid var(--border-color);
      display: none;
      animation: fadeIn 0.25s ease-in-out;
    }

    .content-card.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--primary-pink);
      margin-bottom: 14px;
    }

    .review-box {
      background: #fff;
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
    }

    .review-user {
      font-weight: 700;
      font-size: 13.5px;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .review-stars {
      color: #ffb703;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .review-text {
      font-size: 13px;
      margin-top: 6px;
      line-height: 1.5;
      color: #6e5d65;
    }

    .review-time {
      font-size: 11px;
      color: #b5a9ab;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .input-field, .textarea-field {
      width: 100%;
      padding: 10px 16px;
      border: 1.5px solid var(--border-color);
      border-radius: 16px;
      font-size: 13.5px;
      background: #fff;
      color: var(--text-main);
      outline: none;
    }

    .input-field:focus, .textarea-field:focus {
      border-color: var(--primary-pink);
      box-shadow: 0 0 0 3px rgba(242, 139, 159, 0.15);
    }

    .star-select-box {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .star-btn {
      background: none;
      border: none;
      font-size: 24px;
      color: #e0d0d5;
      cursor: pointer;
      transition: color 0.15s;
    }

    .star-btn.selected {
      color: #ffb703;
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #f29bb0, var(--primary-pink));
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(242, 139, 159, 0.3);
      transition: opacity 0.2s;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-card">
      <h1 class="store-name">babyfinch ♡</h1>
      <p class="store-bio">welcome to babyfinch ♡</p>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('review')">Review</button>
    </div>

    <div class="content-card active" id="tab-review">
      <h2 class="section-title">Reviews ♡</h2>
      
      <div id="reviewsList"></div>

      <div style="margin-top: 20px; border-top: 1.5px dashed var(--border-color); padding-top: 16px;">
        <div class="star-select-box">
          <button type="button" class="star-btn selected" onclick="setRating(1)">★</button>
          <button type="button" class="star-btn selected" onclick="setRating(2)">★</button>
          <button type="button" class="star-btn selected" onclick="setRating(3)">★</button>
          <button type="button" class="star-btn selected" onclick="setRating(4)">★</button>
          <button type="button" class="star-btn selected" onclick="setRating(5)">★</button>
        </div>

        <div class="form-group">
          <input type="text" class="input-field" id="reviewerName" placeholder="Name">
        </div>
        <div class="form-group">
          <textarea class="textarea-field" id="reviewComment" rows="3" placeholder="เขียนรีวิวที่นี่..."></textarea>
        </div>
        <button class="submit-btn" id="submitReviewBtn" onclick="submitReview()">Submit Review</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA1rAxaAY0wN1xiWU5Co0X1_Js-wtTUX08",
      authDomain: "babyfinch-7bfb4.firebaseapp.com",
      projectId: "babyfinch-7bfb4",
      storageBucket: "babyfinch-7bfb4.firebasestorage.app",
      messagingSenderId: "666957156675",
      appId: "1:666957156675:web:5444ec35b013da1d135ff6",
      measurementId: "G-P2XW8DXDMZ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentRating = 5;

    function setRating(rating) {
      currentRating = rating;
      const stars = document.querySelectorAll('.star-btn');
      stars.forEach((star, index) => {
        if (index < rating) {
          star.classList.add('selected');
        } else {
          star.classList.remove('selected');
        }
      });
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.content-card').forEach(card => card.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');
    }

    function listenToReviews() {
      db.collection("babyfinch_reviews")
        .orderBy("createdAt", "desc")
        .onSnapshot(snapshot => {
          const list = document.getElementById('reviewsList');
          if (snapshot.empty) {
            list.innerHTML = '<p style="text-align: center; color: var(--text-muted); font-size: 13px;">ยังไม่มีรีวิว</p>';
            return;
          }
          let html = '';
          snapshot.forEach(doc => {
            const r = doc.data();
            html += `
              <div class="review-box">
                <div class="review-user">
                  <span>${r.name}</span>
                  <span class="review-stars">${'★'.repeat(r.stars || 5)}</span>
                </div>
                <div class="review-text">${r.comment}</div>
                <div class="review-time">${r.time || ''}</div>
              </div>
            `;
          });
          list.innerHTML = html;
        }, error => {
          console.error("Firebase read error: ", error);
        });
    }

    async function submitReview() {
      const name = document.getElementById('reviewerName').value.trim();
      const comment = document.getElementById('reviewComment').value.trim();
      const btn = document.getElementById('submitReviewBtn');

      if (!name || !comment) return;

      btn.disabled = true;
      btn.style.opacity = '0.6';

      try {
        await db.collection("babyfinch_reviews").add({
          name: name,
          stars: currentRating,
          comment: comment,
          time: 'รีวิวเมื่อเร็วๆ นี้',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById('reviewerName').value = '';
        document.getElementById('reviewComment').value = '';
        setRating(5);
      } catch (e) {
        console.error("Firebase write error: ", e);
      } finally {
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    }

    window.onload = function() {
      listenToReviews();
    };
  </script>
</body>
</html>
