<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin ♡ babyfinch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-color: #fff4f6;
      --card-bg: #ffffff;
      --primary-pink: #ee8399;
      --border-color: #f7d5de;
      --text-main: #4a3e3d;
      --text-muted: #968688;
      --shadow: 0 8px 24px rgba(238, 131, 153, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px 16px 80px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    #loginView {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 80vh;
    }

    .login-card {
      background: var(--card-bg);
      border-radius: 28px;
      padding: 36px 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .bow-icon {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .login-title {
      font-size: 22px;
      color: var(--primary-pink);
      font-weight: 700;
      margin-bottom: 24px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
      padding-left: 4px;
    }

    .input-pill {
      width: 100%;
      height: 48px;
      border: 1.5px solid var(--border-color);
      border-radius: 24px;
      padding: 0 18px;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
      background: #fff;
    }

    .input-pill:focus {
      border-color: var(--primary-pink);
      box-shadow: 0 0 0 3px rgba(238, 131, 153, 0.15);
    }

    .btn-pink {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #f29bb0, var(--primary-pink));
      color: white;
      border: none;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(238, 131, 153, 0.35);
      transition: all 0.2s;
      margin-top: 10px;
    }

    .btn-pink:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .error-text {
      color: #ff4d6d;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    #dashboardView {
      display: none;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .nav-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
    }

    .logout-btn {
      background: #fbeef2;
      color: #b57a87;
      border: none;
      padding: 6px 16px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .welcome-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .welcome-title {
      font-size: 24px;
      color: var(--primary-pink);
      font-weight: 700;
    }

    .welcome-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 20px 14px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .stat-icon {
      font-size: 22px;
      margin-bottom: 6px;
    }

    .stat-number {
      font-size: 26px;
      font-weight: 700;
      color: var(--primary-pink);
    }

    .stat-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 2px;
    }

    .stat-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 14px;
    }

    .review-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .review-left {
      flex: 1;
      padding-right: 10px;
    }

    .review-author {
      font-weight: 700;
      font-size: 15px;
      color: var(--text-main);
    }

    .review-stars {
      color: #ffb703;
      font-size: 13px;
      margin: 3px 0;
    }

    .review-comment {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .review-time {
      font-size: 11px;
      color: #b5a9ab;
      margin-top: 4px;
    }

    .btn-delete {
      background: #fbeef2;
      border: 1px solid var(--border-color);
      color: var(--primary-pink);
      padding: 6px 14px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">

    <div id="loginView">
      <div class="login-card">
        <div class="bow-icon">🎀</div>
        <h1 class="login-title">Admin Login ♡</h1>
        
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" class="input-pill" placeholder="ancharee09605@gmail.com" required>
          </div>
          
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPass" class="input-pill" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn-pink">เข้าสู่ระบบ ✨</button>
          <p id="loginError" class="error-text">อีเมลหรือรหัสผ่านไม่ถูกต้อง</p>
        </form>
      </div>
    </div>

    <div id="dashboardView">
      
      <div class="top-nav">
        <div class="nav-title">Admin ♡</div>
        <button class="logout-btn" onclick="handleLogout()">Log Out</button>
      </div>

      <div class="welcome-header">
        <h2 class="welcome-title">Welcome Admin ♡</h2>
        <p class="welcome-sub">manage your reviews and website profile</p>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-icon">💬</div>
          <div class="stat-number" id="totalReviewsCount">0</div>
          <div class="stat-label">Total Reviews</div>
          <div class="stat-desc">Live from Cloud</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">⭐</div>
          <div class="stat-number" id="totalStarsCount">0</div>
          <div class="stat-label">Total Stars</div>
          <div class="stat-desc">All reviews</div>
        </div>
      </div>

      <div class="section-title">Delete Reviews</div>
      <div id="reviewsContainer"></div>

    </div>

  </div>

  <script>
    const AUTH_EMAIL = "ancharee09605@gmail.com";
    const AUTH_PASS = "4307";

    const firebaseConfig = {
      apiKey: "AIzaSyA1rAxaAY0wN1xiWU5Co0X1_Js-wtTUX08",
      authDomain: "babyfinch-7bfb4.firebaseapp.com",
      projectId: "babyfinch-7bfb4",
      storageBucket: "babyfinch-7bfb4.firebasestorage.app",
      messagingSenderId: "666957156675",
      appId: "1:666957156675:web:5444ec35b013da1d135ff6",
      measurementId: "G-P2XW8DXDMZ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    window.onload = function() {
      if (sessionStorage.getItem('babyfinch_admin_logged') === 'true') {
        showDashboard();
      }
    };

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      const err = document.getElementById('loginError');

      if (email === AUTH_EMAIL && pass === AUTH_PASS) {
        sessionStorage.setItem('babyfinch_admin_logged', 'true');
        err.style.display = 'none';
        showDashboard();
      } else {
        err.style.display = 'block';
      }
    }

    function handleLogout() {
      sessionStorage.removeItem('babyfinch_admin_logged');
      document.getElementById('dashboardView').style.display = 'none';
      document.getElementById('loginView').style.display = 'flex';
    }

    function showDashboard() {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'block';
      listenToReviewsAdmin();
    }

    function listenToReviewsAdmin() {
      db.collection("babyfinch_reviews")
        .orderBy("createdAt", "desc")
        .onSnapshot(snapshot => {
          document.getElementById('totalReviewsCount').textContent = snapshot.size;

          let totalStars = 0;
          const container = document.getElementById('reviewsContainer');

          if (snapshot.empty) {
            container.innerHTML = '<p style="text-align: center; color: var(--text-muted); font-size: 13px;">No reviews</p>';
            document.getElementById('totalStarsCount').textContent = '0';
            return;
          }

          let html = '';
          snapshot.forEach(doc => {
            const r = doc.data();
            totalStars += (r.stars || 5);
            html += `
              <div class="review-card">
                <div class="review-left">
                  <div class="review-author">${r.name}</div>
                  <div class="review-stars">${'★'.repeat(r.stars || 5)}</div>
                  <div class="review-comment">${r.comment}</div>
                  <div class="review-time">${r.time || ''}</div>
                </div>
                <button class="btn-delete" onclick="deleteReview('${doc.id}')">
                  Delete
                </button>
              </div>
            `;
          });

          document.getElementById('totalStarsCount').textContent = totalStars;
          container.innerHTML = html;
        });
    }

    async function deleteReview(docId) {
      try {
        await db.collection("babyfinch_reviews").doc(docId).delete();
      } catch (e) {
        console.error("Error deleting document: ", e);
      }
    }
  </script>
</body>
</html>
